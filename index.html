<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#49365f" />
    <meta
      name="description"
      content="SysAdmin Path | Zshalia Paclibar — a personal IT learning and certification portfolio."
    />
    <title>SysAdmin Path | Zshalia Paclibar</title>
  </head>
  <body>
    <div id="root">
      <p style="margin: 3rem auto; max-width: 34rem; padding: 1rem; font: 1rem/1.6 sans-serif; color: #49365f">
        Loading the SysAdmin Path portfolio…
      </p>
    </div>
    <script>
      const root = document.getElementById('root');
      setTimeout(() => {
        if (root && !root.querySelector('.app, .startup-error')) {
          root.innerHTML =
            '<div role="alert" style="margin: 3rem auto; max-width: 34rem; padding: 1rem; font: 1rem/1.6 sans-serif; color: #49365f">' +
            '<h1 style="font-size: 1.4rem">The portfolio could not start</h1>' +
            '<p>Reload the page and check your internet connection. If the problem continues, check the browser console for a loading error.</p>' +
            '</div>';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
